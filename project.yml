name: Gootif
options:
  bundleIdPrefix: com.goosheys
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_GootifPushEnvironment: $(APNS_ENVIRONMENT)
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Gootif:
    type: application
    platform: iOS
    sources:
      - path: Gootif
        excludes:
          - "**/*.example"
    entitlements:
      path: Gootif/App/Gootif.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        PRODUCT_BUNDLE_IDENTIFIER: com.goosheys.gootif
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Gootif
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        DEVELOPMENT_TEAM: MV8X85T53K

  GootifUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GootifUITests
    dependencies:
      - target: Gootif
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosheys.gootif.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Gootif:
    build:
      targets:
        Gootif: all
    test:
      targets:
        - GootifUITests
